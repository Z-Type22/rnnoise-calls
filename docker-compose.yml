services:
  postgres:
    image: postgres:14
    env_file:
      - ./.env
    container_name: ECHO_PGDB
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  fastapi:
    build:
      context: .
      dockerfile: ./Dockerfile
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    container_name: ECHO_FASTAPI
    depends_on:
      - postgres


volumes:
  pgdata:
